# Checker host: install as /etc/rsyslog.d/60-mw-audit-recv.conf, then: systemctl restart rsyslog
# Receives the watched host's shipped audit stream and writes it to a local file
# that survives the watched host being wiped.
#
# Open TCP 6514 to the watched host's source IP ONLY (the address it connects
# FROM). Make sure the firewall allows 6514/tcp from that source and nothing else.
# Syslog over plain TCP is unauthenticated and unencrypted: restrict by source IP
# and/or tunnel it (WireGuard/stunnel); consider rsyslog's TLS (gtls) driver.

module(load="imtcp")
input(type="imtcp" port="6514")

if ($fromhost-ip == '203.0.113.10') then {      # <- the watched host's source IP
    action(type="omfile"
           file="/var/log/remote/watched-host-audit.log"
           fileCreateMode="0640" dirCreateMode="0750"
           fileOwner="root" fileGroup="adm")
    stop
}
# (optional) drop anything else that reaches this port
