# Watched host: install as  /etc/rsyslog.d/60-mw-audit-fwd.conf   then: systemctl restart rsyslog
# Forwards audit events (emitted to syslog by the audisp syslog plugin) to a checker host over TCP,
# with an on-disk spool so nothing is lost if the checker is briefly unreachable.
#
# CAVEAT: if this host's outbound path goes through a VPN with a kill-switch, shipping
# pauses whenever the tunnel drops. That is acceptable -- this stream is the FORENSIC
# ARCHIVE. The primary tamper alarm is the INBOUND off-box pull (mw-deadman), which is
# independent of the host's own egress. The queue spools to disk meanwhile.
# Plain TCP syslog is unauthenticated/unencrypted: restrict by source IP on the
# receiver and/or tunnel it (WireGuard/stunnel) or use rsyslog's TLS driver.

template(name="mwAuditFwd" type="string" string="<%PRI%>%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n")

if ($programname startswith 'audisp' or $syslogtag contains 'audit' or $msg contains 'type=SYSCALL' or $msg contains 'key=\"mw') then {
    action(type="omfwd"
           target="198.51.100.20"   /* <- checker host address */ port="6514" protocol="tcp"
           template="mwAuditFwd"
           action.resumeRetryCount="-1"
           queue.type="linkedList"
           queue.filename="mw_audit_fwd"
           queue.maxDiskSpace="50m"
           queue.saveOnShutdown="on")
    stop
}
