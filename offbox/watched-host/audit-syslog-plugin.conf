# Watched host: install as  /etc/audit/plugins.d/syslog.conf   (root:root, 0640)
# (on auditd 3.x / Ubuntu 24.04 the audisp syslog plugin lives here; on older
#  layouts it is /etc/audisp/plugins.d/syslog.conf). Ships every audit event to
# syslog so rsyslog can forward it OFF-BOX to a checker host. Enable, then: systemctl restart auditd
active = yes
direction = out
path = builtin_syslog
type = builtin
args = LOG_INFO
format = string
