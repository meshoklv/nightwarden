# Watched host: install as  /etc/systemd/system/malware-watch.service.d/hardening.conf
# then:  systemctl daemon-reload  (test it: run `malware-watch.sh dryrun` under the unit before trusting it).
#
# This is a DROP-IN: it only ADDS the [Service] directives below to the existing
# malware-watch.service. It is tuned to NOT break what the watcher actually does:
#   iptables (NET_ADMIN) · read /proc of every container (SYS_PTRACE + DAC_READ_SEARCH)
#   · nsenter -t PID -n into other net-namespaces (SYS_ADMIN/setns) · kill implants (KILL)
#   · docker inspect over /run/docker.sock · curl to the alert channel.
#
# The watcher runs as root; these directives SHRINK what that root can do and make
# /etc and /usr read-only TO THE SERVICE, so a watcher compromise can't rewrite its
# own units/scripts or the persistence surfaces it guards.

[Service]
# --- privilege / exec surface ---
NoNewPrivileges=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
ProtectClock=yes
ProtectHostname=yes
PrivateTmp=yes

# --- filesystem: protect the tamper targets, keep the writes the watcher needs ---
# ProtectSystem=full makes /usr, /boot, /etc, /efi READ-ONLY to the service (its own
# scripts/units/env become unwritable) while leaving /var and /run writable — so
# /run/docker.sock and the state/log dirs keep working. Do NOT switch to =strict
# without also adding /run/docker.sock to ReadWritePaths, or the docker check breaks.
ProtectSystem=full
ProtectHome=read-only            # /root & /home stay READABLE (authorized_keys checks work); NOT =yes (that hides them)
ReadWritePaths=/var/lib/malware-watch /var/log/malware-watch
ProtectControlGroups=yes         # WARNING: remove this if you use cgroup.kill based subtree kills (they write cgroup.kill)

# --- capabilities: exactly the set the watcher uses, nothing else ---
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_PTRACE CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_SYS_ADMIN CAP_KILL CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE CAP_SYS_RESOURCE
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# --- credentials: intentionally NOT using LoadCredential= ---
# `LoadCredential=tg:/etc/malware-watch.env` makes the unit FAIL TO START if that
# file does not exist, and gains nothing here: the watcher runs as root and reads
# its env file directly. If you want it anyway, use a path that always exists
# (create it at install time) and keep it consistent with ConditionPathExists=.

# ============================================================================
# DELIBERATELY NOT SET (each would break the watcher — do not add):
#   RestrictNamespaces=...     -> breaks `nsenter -n` (setns into container netns)
#   SystemCallFilter=@system-service -> blocks setns/ptrace -> breaks nsenter & /proc reads
#   ProtectSystem=strict       -> makes /run read-only -> breaks /run/docker.sock
#   MemoryDenyWriteExecute=yes -> can break curl/openssl TLS -> alerts fail
#   ProtectKernelModules/Tunables, IPAddressDeny -> risk iptables/nsenter/curl paths
#   ProtectProc=invisible / hidepid -> the watcher's whole job is reading other /proc
# ============================================================================
